<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>AnyListen 账号助手</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>账号歌单</h1><span class="muted">AnyListen</span></div><div class="actions"><button id="pair">连接播放器</button><button id="refresh" class="primary">同步</button></div></header>
<div id="notice" role="status" aria-live="polite"></div><div id="pairbox" hidden><span>在扩展的“连接账号助手”中输入：</span><strong id="paircode"></strong></div>
<nav aria-label="页面"><button data-tab="accounts" class="active">账号</button><button data-tab="lists">歌单</button><button data-tab="archives">归档与回收站</button></nav>
<main><section id="accounts"><div class="cards">
<article><h2>网易云</h2><p id="netease-state" class="muted">未登录</p><button data-login="netease">账号登录</button></article>
<article><h2>QQ音乐</h2><p id="qqmusic-state" class="muted">未登录</p><button id="qq-login">账号登录</button></article>
<article><h2>酷狗</h2><p id="kugou-state" class="muted">未登录</p><button data-login="kugou">账号登录</button></article>
</div><details class="webdav"><summary>LX N WebDAV</summary><form id="webdav-form"><input name="url" type="url" placeholder="WebDAV 地址" required><input name="folder" value="/LX_Music" placeholder="目录"><input name="username" placeholder="账号" required><input name="password" type="password" placeholder="密码" required autocomplete="off"><button class="primary">保存并同步</button></form><p id="lx-state" class="muted"></p></details></section>
<section id="lists" hidden><div class="toolbar"><select id="client" aria-label="播放器"></select><input id="filter" placeholder="搜索歌单"><span id="online" class="muted"></span></div><div class="toolbar"><button id="select-all">全选</button><button id="clear">取消选择</button><span id="count">0 已选</span><div class="grow"></div><button id="archive" disabled>归档</button><button id="delete" class="danger" disabled>删除</button></div><p class="muted hint">Ctrl 多选 · Shift 连选</p><div id="playlist-grid" role="grid" aria-multiselectable="true" tabindex="0"></div><p id="empty" class="muted"></p></section>
<section id="archives" hidden><div id="archive-list"></div><p id="archive-empty" class="muted"></p></section>
</main>
<dialog id="login-dialog"><form id="login-form"><h2 id="login-title">账号登录</h2><input name="phone" id="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="手机号" required pattern="1[0-9]{10}"><div class="row"><input name="code" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="验证码" pattern="[0-9]{4,8}"><button type="button" id="send-code">获取验证码</button></div><p id="login-status" role="status"></p><div class="actions"><button type="button" id="login-cancel">取消</button><button id="login-submit" class="primary">登录</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
