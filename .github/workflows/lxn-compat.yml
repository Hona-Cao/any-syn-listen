name: LX-N WebDAV compatibility checks
on:
  push:
    branches: [feat/lxn-webdav-interop-clean]
  pull_request:
    paths:
      - 'packages/shared/app/modules/sync/lxn/**'
      - 'packages/desktop/src/modules/sync/**'
      - 'packages/view-main/src/views/Setting/AppSetting/DataSyncWebdav.svelte'
      - 'tests/lxnProtocol.test.mjs'
      - '.github/workflows/lxn-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/lxnProtocol.test.mjs
  desktop-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -F @shared/scripts build:desktop
