name: AnySynListen integrated account browser (Windows test)

on:
  push:
    branches: [feat/native-account-browser, feat/integrated-playlist-sync]
    paths:
      - 'packages/**'
      - '.github/workflows/native-account-browser-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install and build Windows native dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify official app isolation and login security
        shell: pwsh
        run: |
          $app = Get-Content "packages/desktop/src/app/index.ts" -Raw
          $pack = Get-Content "packages/desktop/build-config/build-pack.cjs" -Raw
          if (!$app.Contains("AnySynListenDatas")) { throw "Missing independent data directory" }
          if (!$app.Contains("app.setAsDefaultProtocolClient('anysynlisten')")) { throw "Fork would take over official URL protocol" }
          if (!$pack.Contains("productName: 'any-syn-listen'")) { throw "Missing distinct app name" }
      - name: Test browser partition, Cookie capture policy and login verification
        run: node --test packages/desktop/test/nativeAccountLogin.test.mjs packages/desktop/test/lxWebdavRoundtrip.test.mjs packages/desktop/test/dailyHistory.test.mjs
      - name: Bundle complete Electron desktop
        run: pnpm -F @shared/scripts build:desktop
      - name: Package portable Windows x64 application
        run: pnpm -F desktop pack:win:portable:x64
      - name: Upload self-contained test application
        uses: actions/upload-artifact@v4
        with:
          name: any-syn-listen-playlist-integration-windows-x64
          path: build/*-portable.exe
          retention-days: 14
          if-no-files-found: error
